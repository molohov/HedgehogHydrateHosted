services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hedgehog
      POSTGRES_PASSWORD: hedgehog
      POSTGRES_DB: hedgehog_hydrate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgehog -d hedgehog_hydrate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://hedgehog:hedgehog@db:5432/hedgehog_hydrate?schema=public
      SESSION_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-before-deploy
      APP_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
